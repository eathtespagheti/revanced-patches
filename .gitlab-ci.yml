# .gitlab-ci.yml for revanced-patches fork
stages:
  - build
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

build:
  stage: build
  image: eclipse-temurin:17-jdk
  cache:
    key: gradle
    paths:
      - ~/.gradle/caches
  script:
    - chmod +x ./gradlew
    - ./gradlew :patches:buildAndroid clean
  artifacts:
    paths:
      - patches/build/libs/patches-*.rvp
    expire_in: 1 week

release:
  stage: release
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl git jq
  script:
    - VERSION=$(git describe --tags --always)
    - echo "Version: $VERSION"
    - RELEASE_NAME="ReVanced Patches ${VERSION}"
    - RELEASE_NOTES="Release ${VERSION}"
    - RELEASE_RESP=$(curl -s -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -H "Content-Type: application/json" -d "{\"name\":\"${RELEASE_NAME}\",\"tag_name\":\"${VERSION}\",\"description\":\"${RELEASE_NOTES}\"}" "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/releases")
    - echo "$RELEASE_RESP"
    - RVP_FILE=$(ls patches/build/libs/patches-*.rvp)
    - echo "Uploading $RVP_FILE..."
    - curl -s -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -F "file=@${RVP_FILE}" -F "name=patches.rvp" "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/releases/${VERSION}/assets/links"
  rules:
    - if: $CI_COMMIT_TAG
