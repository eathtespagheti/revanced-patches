stages:
  - build
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

build:
  stage: build
  image: eclipse-temurin:17-jdk
  cache:
    key: gradle
    paths:
      - ~/.gradle/caches
  script:
    - chmod +x ./gradlew
    - ./gradlew :patches:buildAndroid clean
  artifacts:
    paths:
      - patches/build/libs/patches-*.rvp
    expire_in: 1 week

release:
  stage: release
  image: alpine:3.20
  script:
    - 'VERSION=$(git describe --tags --always)'
    - 'echo "Version: $VERSION"'
    - 'curl -s -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -d "{\"name\":\"ReVanced Patches ${VERSION}\",\"tag_name\":\"${VERSION}\",\"description\":\"Release ${VERSION}\"}" "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/releases"'
    - 'RVP_FILE=$(ls patches/build/libs/patches-*.rvp)'
    - 'curl -s -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -F "file=@${RVP_FILE}" -F "name=patches.rvp" "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/releases/${VERSION}/assets/links"'
  rules:
    - if: $CI_COMMIT_TAG
